<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ASF Ponto — Quem está em qual pico agora | ASF</title><meta name="description" content="Check-in ao vivo: veja em qual pico as surfistas da comunidade ASF estão agora e marque o seu. Satélite do app ASF."><link rel="canonical" href="https://acarolmourad-commits.github.io/asf-ponto/"><meta name="theme-color" content="#00A8CC"><style>:root{--p:#00A8CC;--d:#0E2439;--u:#9B59B6;--bg:#F7FBFC;--g:#5A6B7A}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--d)}nav{position:sticky;top:0;background:#fff;border-bottom:1px solid #E5EEF2;padding:10px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}nav a{color:var(--p);text-decoration:none;font-weight:700;font-size:13px}nav a.on{color:var(--u)}header{background:linear-gradient(135deg,var(--p),var(--u));color:#fff;padding:40px 20px 30px;text-align:center}.wrap{max-width:640px;margin:0 auto;padding:24px 16px 60px}.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(14,36,57,.06)}select,input[type=text]{width:100%;padding:10px;border:2px solid var(--p);border-radius:10px;font-size:15px;margin:6px 0;font-family:inherit}button.salvar{background:linear-gradient(135deg,var(--p),var(--u));color:#fff;border:0;padding:11px 20px;border-radius:999px;font-weight:700;cursor:pointer}.pico{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #EEF3F5;font-size:14.5px}.muted{color:var(--g);font-size:12.5px}footer{text-align:center;font-size:12.5px;color:var(--g);padding:24px;border-top:1px solid #E5EEF2}</style></head><body><nav><a href="https://acarolmourad-commits.github.io/asf-app/">🏄 App</a><a class="on" href="https://acarolmourad-commits.github.io/asf-ponto/">📍 Ponto</a><a href="https://acarolmourad-commits.github.io/asf-mapa/">🗺️ Mapa</a><a href="https://acarolmourad-commits.github.io/asf-carona/">🚗 Carona</a><a href="https://acarolmourad-commits.github.io/asf-comunidade/">🤝 Comunidade</a></nav><header><h1>📍 Quem tá no pico?</h1><p>Check-in da comunidade: marque onde você está e encontre as manas.</p></header><main class="wrap"><div class="card"><input type="text" id="nome" placeholder="Seu nome ou apelido" maxlength="30"><select id="praia"><option>Praia da Baleia</option><option>Camburizinho</option><option>Maresias</option><option>Juquehy</option><option>Itamambuca</option><option>Perequê-Açu</option><option>Boracéia</option><option>Brava (Caraguá)</option></select><button class="salvar" onclick="checkin()">Fazer check-in 🏄‍♀️</button></div><div class="card"><h2 style="font-size:15.5px;margin-bottom:8px">No pico agora (demo local)</h2><div id="lista"></div></div><p class="muted">Dados ficam no seu navegador (demo). Combine sessões pela <a href="https://acarolmourad-commits.github.io/asf-comunidade/" style="color:var(--p)">Comunidade</a> e veja as condições no <a href="https://acarolmourad-commits.github.io/asf-previsao/" style="color:var(--p)">ASF Previsão</a>.</p></main><footer>🌊 ASF · <a href="https://acarolmourad-commits.github.io/" style="color:var(--p)">Hub de apps</a></footer><script>const K='asf-ponto-v1';let d=JSON.parse(localStorage.getItem(K)||'[]');function render(){const por={};d.forEach(x=>por[x.p]=(por[x.p]||0)+1);const l=document.getElementById('lista');l.innerHTML='';const ks=Object.keys(por);if(!ks.length){l.innerHTML='<div class="muted">Ninguém marcou ainda — seja a primeira! 🌊</div>';return;}ks.sort((a,b)=>por[b]-por[a]).forEach(p=>l.insertAdjacentHTML('beforeend',`<div class="pico"><span>${p}</span><strong>${por[p]}🏄‍♀️</strong></div>`));}function checkin(){const n=document.getElementById('nome').value.trim();if(!n)return alert('Diga seu nome ou apelido!');d.push({n,p:document.getElementById('praia').value,t:Date.now()});localStorage.setItem(K,JSON.stringify(d));render();}render();</script></body></html>
